name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_id:
        description: "Existing EAS build ID to reuse (skips a new EAS build)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        id: build
        if: ${{ github.event.inputs.build_id == '' }}
        run: |
          BUILD_ID=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json | jq -r '.[0].id')
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve build ID
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            echo "BUILD_ID=${{ github.event.inputs.build_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD_ID=${{ steps.build.outputs.BUILD_ID }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        run: |
          APK_PATH=$(eas build:download \
            --build-id "${{ steps.resolve.outputs.BUILD_ID }}" \
            --json | jq -r '.path')
          cp "$APK_PATH" "Pallas-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Pallas-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes