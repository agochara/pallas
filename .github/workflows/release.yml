name: Build and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        id: build
        run: |
          BUILD_ID=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json | jq -r '.[0].id')

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          eas build:download \
            --build-id "${{ steps.build.outputs.BUILD_ID }}" \
            --non-interactive

          mv *.apk "Pallas-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Pallas-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes